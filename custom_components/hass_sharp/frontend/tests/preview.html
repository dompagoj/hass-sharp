<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HassSharp UI preview (sample data)</title>
<style>html,body{height:100%;margin:0;background:#e5e7eb;font:14px system-ui}header{height:48px;display:flex;align-items:center;gap:12px;padding:0 16px}button{padding:6px 12px}iframe{display:block;border:0;height:calc(100% - 48px);width:100%;margin:auto;background:white}</style></head>
<body><header><strong>UI preview · sample data</strong><button onclick="document.querySelector('iframe').style.width='360px'">360px</button><button onclick="document.querySelector('iframe').style.width='100%'">Desktop</button><button onclick="document.querySelector('iframe').contentWindow.setPreviewTheme('light')">Light</button><button onclick="document.querySelector('iframe').contentWindow.setPreviewTheme('dark')">Dark</button></header>
<iframe title="HassSharp sample workspace" src="./preview-app.html"></iframe><script>document.querySelector('iframe').src = new URL('preview-app.html' + location.search, location.href).href</script></body></html>
