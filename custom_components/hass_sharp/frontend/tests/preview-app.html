<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sample workspace</title><style>html,body,#preview{height:100%;margin:0}</style></head><body><div id="preview"></div><script>window.previewErrors=[];window.addEventListener('error',e=>window.previewErrors.push({message:e.message,filename:e.filename,stack:e.error?.stack}));window.addEventListener('unhandledrejection',e=>window.previewErrors.push({rejection:String(e.reason),stack:e.reason?.stack}));</script><script type="module" src="/tests/preview.tsx"></script></body></html>
