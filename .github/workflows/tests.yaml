name: Tests

# Every suite, on each push and pull request; release.yaml runs this workflow first and publishes only if it passes.
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    name: Python (Home Assistant 2026.11.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Home Assistant
        # The version the local development container runs. The tests also load Home Assistant's mcp_server, so the
        # requirements of it and of its dependencies (conversation, http, intent, llm) in that version are installed too.
        run: |
          python -m pip install --upgrade pip
          python -m pip install homeassistant==2026.11.1 mcp==2.3.0 aiohttp_sse==2.2.0 anyio==4.15.1 \
            hassil==3.12.1 home-assistant-intents==2026.10.27 gazetteer-matcher==1.1.0
      - name: Check that the Home Assistant tests will run
        # Without these imports the MCP adapter and native class-trigger tests skip, and the job would still pass.
        run: python -c "import probatio, homeassistant.components.mcp_server.server; from homeassistant.helpers.trigger import StatelessEntityTriggerBase"
      - name: Integration tests
        # From the repository root: the tests read the integration by relative path. With Home Assistant installed none
        # of them is skipped.
        run: python -m unittest discover -s tests/python -v
      - name: Release packaging tests
        run: python -m unittest discover -s tests -v

  dotnet:
    name: .NET (runtime, editor, Python.NET smokes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Runtime suites
        run: dotnet run --project tests/Runtime --disable-build-servers
      - name: Editor tests
        run: dotnet test custom_components/hass_sharp/HassSharp.Editor.Tests --disable-build-servers
      - name: Publish the library
        run: dotnet publish -c Release ./custom_components/hass_sharp/HassSharp -o ./custom_components/hass_sharp/out
      - name: Python.NET smokes against the published library
        run: |
          python -m venv /tmp/hass-sharp-pythonnet
          /tmp/hass-sharp-pythonnet/bin/pip install pythonnet==3.1.0
          /tmp/hass-sharp-pythonnet/bin/python tests/packaging/sqlite_smoke.py custom_components/hass_sharp
          /tmp/hass-sharp-pythonnet/bin/python tests/packaging/visual_values_smoke.py custom_components/hass_sharp/out/HassSharp.dll

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: custom_components/hass_sharp/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Tests
        run: bun run test
      - name: Build
        run: bun run build
