name: Release

on:
  release:
    types: [published]

jobs:
  tests:
    # Every suite (tests.yaml) passes before anything is packaged.
    uses: ./.github/workflows/tests.yaml

  release:
    name: Prepare release
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: "actions/checkout@v4"
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Test release packaging
        run: python3 -m unittest discover -s tests -v
      - name: Publish HassSharp C# Library
        run: |
          dotnet publish -c Release ./custom_components/hass_sharp/HassSharp -o ./custom_components/hass_sharp/out
      - name: Verify packaged SQLite through Python.NET
        run: |
          python -m venv /tmp/hass-sharp-packaging
          /tmp/hass-sharp-packaging/bin/pip install pythonnet==3.1.0
          /tmp/hass-sharp-packaging/bin/python tests/packaging/sqlite_smoke.py custom_components/hass_sharp
      - name: Build Vite Frontend
        run: |
          cd ./custom_components/hass_sharp/frontend
          bun install --frozen-lockfile
          bun run build
      - name: Package Marketplace integration
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 scripts/package_release.py --version "$RELEASE_TAG"
      - name: Upload zip to release
        uses: softprops/action-gh-release@v2.2.1
        with:
          files: ${{ github.workspace }}/dist/hass_sharp.zip
          fail_on_unmatched_files: true
